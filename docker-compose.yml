services:
  postgres:
    image: postgres:16
    container_name: osint-postgres
    environment:
      POSTGRES_DB: osint_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_this_admin_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osint_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: osint-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "change_this_redis_password"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "change_this_redis_password", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
  redis_data:
